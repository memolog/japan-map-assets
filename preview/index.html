<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japan map assets preview</title>
<style>body{font:16px system-ui;margin:24px;background:#f4f6f5;color:#22352f}header{display:flex;flex-wrap:wrap;gap:16px;align-items:center}#map{max-width:1000px;margin:24px auto;background:repeating-conic-gradient(#fff 0% 25%,#edf0ed 0% 50%) 0/20px 20px;border:1px solid #ccc}#map svg{display:block;width:100%;max-height:75vh}#icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.icon{background:white;padding:12px;text-align:center}.icon img{width:90px;height:90px;object-fit:contain}label{display:flex;gap:6px}#status{min-height:24px}</style>
<h1>Japan map assets</h1><header><label>Layout <select id="layout"><option value="video">Video</option><option value="geographic">Geographic</option></select></label><label>Aspect <select id="aspect"><option>16x9</option><option>9x16</option></select></label><label>Prefecture <select id="pref"></select></label><label>Fill <input id="color" type="color" value="#ea916b"></label><label>Boundary width <input id="stroke" type="range" min="0" max="4" step=".25" value="1"></label></header>
<p>Video: Okinawa inset only, with its right edge aligned to Hokkaido's east edge. Ogasawara and secondary islands overlapping the inset are omitted. Geographic retains all islands. Click a prefecture to select it.</p><p id="status" role="status"></p><div id="map"></div><h2>47 prefecture silhouettes</h2><div id="icons"></div>
<script type="module">
const $=id=>document.getElementById(id);let revision=0;const colors=new Map();let names=[];
async function load(){const rev=++revision;try{const file=$('layout').value==='video'?`japan-video-${$('aspect').value}.svg`:'japan-geographic.svg';const r=await fetch('/dist/'+file);if(!r.ok)throw Error('Generate maps first: npm run generate:maps');const text=await r.text();if(rev!==revision)return;$('map').innerHTML=text;const paths=[...$('map').querySelectorAll('[data-code]')];if(!names.length){names=paths.map(p=>({code:p.dataset.code,name:p.dataset.name}));for(const p of names){const o=document.createElement('option');o.value=p.code;o.textContent=`${p.code} ${p.name}`;$('pref').append(o);const card=document.createElement('div');card.className='icon';const img=document.createElement('img');img.src=`/dist/prefectures/${p.code}.svg`;img.alt=p.name;const label=document.createElement('div');label.textContent=o.textContent;card.append(img,label);$('icons').append(card);}}for(const p of paths){if(colors.has(p.dataset.code))p.style.fill=colors.get(p.dataset.code);p.addEventListener('click',()=>{$('pref').value=p.dataset.code;$('status').textContent=`${p.dataset.code} ${p.dataset.name}`;});p.addEventListener('pointerenter',()=>{$('status').textContent=`${p.dataset.code} ${p.dataset.name}`;});}stroke();}catch(e){$('status').textContent=e.message;}}
function stroke(){$('map').querySelector('svg')?.style.setProperty('--map-stroke-width',$('stroke').value);}
$('layout').onchange=load;$('aspect').onchange=load;$('stroke').oninput=stroke;$('color').oninput=()=>{const code=$('pref').value;colors.set(code,$('color').value);$('map').querySelector(`#pref-${code}`).style.fill=$('color').value;};load();
</script></html>
